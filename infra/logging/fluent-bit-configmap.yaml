apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: convertx
data:
  # Parsers are shipped here rather than relying on the image's own
  # /fluent-bit/etc/parsers.conf, so the config is self-contained.
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) ?(?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

  fluent-bit.conf: |
    [SERVICE]
        Flush            5
        Daemon           Off
        Log_Level        info
        Parsers_File     /fluent-bit/etc/conf/parsers.conf
        HTTP_Server      On
        HTTP_Listen      0.0.0.0
        HTTP_Port        2020
        # /api/v1/health 404s unless this is enabled — the DaemonSet's
        # readiness probe depends on it.
        Health_Check     On
        HC_Period        30
        HC_Errors_Count  5
        HC_Retry_Failure_Count 5

    # Docker Desktop's Kubernetes uses containerd, so container logs are in
    # CRI format under /var/log/containers/<pod>_<namespace>_<container>-<id>.log.
    # One input per workload keeps routing explicit — no kubernetes metadata
    # filter, which means no RBAC and one less failure mode.

    [INPUT]
        Name             tail
        Tag              convertx.auth
        Path             /var/log/containers/auth-service-*_convertx_*.log
        Parser           cri
        DB               /var/log/flb-auth.db
        Mem_Buf_Limit    10MB
        Skip_Long_Lines  On
        Refresh_Interval 10

    [INPUT]
        Name             tail
        Tag              convertx.conversion
        Path             /var/log/containers/conversion-service-*_convertx_*.log
        Parser           cri
        DB               /var/log/flb-conversion.db
        Mem_Buf_Limit    10MB
        Skip_Long_Lines  On
        Refresh_Interval 10

    # Kong's dataplane pod is operator-managed; its name is generated but
    # always prefixed "dataplane-". This is what picks up the file-log plugin
    # output that Kong writes to stdout.
    [INPUT]
        Name             tail
        Tag              convertx.kong
        Path             /var/log/containers/dataplane-*_kong_*.log
        Parser           cri
        DB               /var/log/flb-kong.db
        Mem_Buf_Limit    10MB
        Skip_Long_Lines  On
        Refresh_Interval 10

    # LocalStack serves CloudWatch Logs over plain HTTP on 4566, so TLS is off
    # and the endpoint is a bare hostname with the port given separately.
    # auto_create_group is false: bootstrap.sh already creates the groups with
    # a retention policy, and letting fluent-bit create them would drop that.

    [OUTPUT]
        Name              cloudwatch_logs
        Match             convertx.auth
        region            us-east-1
        endpoint          localstack.localstack.svc.cluster.local
        port              4566
        tls               Off
        log_group_name    /convertx/auth-service
        log_stream_prefix fluentbit-
        auto_create_group false

    [OUTPUT]
        Name              cloudwatch_logs
        Match             convertx.conversion
        region            us-east-1
        endpoint          localstack.localstack.svc.cluster.local
        port              4566
        tls               Off
        log_group_name    /convertx/conversion-service
        log_stream_prefix fluentbit-
        auto_create_group false

    [OUTPUT]
        Name              cloudwatch_logs
        Match             convertx.kong
        region            us-east-1
        endpoint          localstack.localstack.svc.cluster.local
        port              4566
        tls               Off
        log_group_name    /convertx/kong
        log_stream_prefix fluentbit-
        auto_create_group false
