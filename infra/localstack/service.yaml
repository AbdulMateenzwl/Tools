apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack
spec:
  selector:
    app: localstack
  ports:
    - name: main
      port: 4566
      targetPort: 4566
    - name: ecr
      port: 4510
      targetPort: 4510
  type: ClusterIP                  # internal only — services inside K8s reach it via DNS