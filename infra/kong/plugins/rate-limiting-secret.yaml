apiVersion: v1
kind: Secret
metadata:
  name: rate-limiting-config
  namespace: convertx
type: Opaque
stringData:
  anonymous-config: |
    {
      "day": 20,
      "policy": "redis",
      "redis": {
        "host": "redis.kong.svc.cluster.local",
        "port": 6379,
        "password": "yourpassword",
        "database": 1,
        "timeout": 2000
      },
      "limit_by": "ip",
      "fault_tolerant": true,
      "hide_client_headers": false,
      "error_code": 429,
      "error_message": "Rate limit exceeded. Please register for higher limits.",
      "sync_rate": -1
    }
  registered-config: |
    {
      "day": 100,
      "policy": "redis",
      "redis": {
        "host": "redis.kong.svc.cluster.local",
        "port": 6379,
        "password": "yourpassword",
        "database": 1,
        "timeout": 2000
      },
      "limit_by": "consumer",
      "fault_tolerant": true,
      "hide_client_headers": false,
      "error_code": 429,
      "error_message": "Daily limit reached. Upgrade your plan for more requests.",
      "sync_rate": -1
    }
