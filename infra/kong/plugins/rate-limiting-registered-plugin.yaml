apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limiting-registered
  namespace: convertx
plugin: rate-limiting
config:
  day: 100
  policy: redis
  redis:
    host: REDIS_HOST_PLACEHOLDER
    port: REDIS_PORT_PLACEHOLDER
    password: REDIS_PASSWORD_PLACEHOLDER
    database: 1
    timeout: 2000
  limit_by: consumer
  fault_tolerant: true
  hide_client_headers: false
  error_code: 429
  error_message: "Daily limit reached. Upgrade your plan for more requests."
  sync_rate: -1