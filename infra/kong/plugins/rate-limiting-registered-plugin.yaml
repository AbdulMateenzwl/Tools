apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limiting-registered
  namespace: convertx
plugin: rate-limiting
config:
  day: 100
  policy: redis
  redis:
    host: redis.kong.svc.cluster.local
    port: 6379
    password: yourpassword
    database: 1
    timeout: 2000
  limit_by: consumer
  fault_tolerant: true
  hide_client_headers: false
  error_code: 429
  error_message: "Daily limit reached. Upgrade your plan for more requests."
  sync_rate: -1