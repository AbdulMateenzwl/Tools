apiVersion: configuration.konghq.com/v1alpha1
kind: KongPluginBinding
metadata:
  name: conversion-cors-binding
  namespace: convertx
spec:
  controlPlaneRef:
    type: kic
  pluginRef:
    name: cors
    kind: KongPlugin
  targets:
    routeRef:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: conversion-service-route

