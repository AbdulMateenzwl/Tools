apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
  namespace: kong
spec:
  controllerName: konghq.com/gateway-operator

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: convertx-gateway
  namespace: kong
spec:
  gatewayClassName: kong
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All