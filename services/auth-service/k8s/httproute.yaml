apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-service-route
  namespace: convertx
  annotations:
    konghq.com/plugins: cors,rate-limiting-anonymous,request-size-limiting,response-headers,request-id,request-logging
spec:
  parentRefs:
    - name: convertx-gateway
      namespace: kong
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth
      backendRefs:
        - name: auth-service
          port: 8080