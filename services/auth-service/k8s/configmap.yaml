apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: convertx
data:
  DB_NAME: convertx_db
  # DB_HOST/REDIS_HOST intentionally absent: RDS and ElastiCache get
  # dynamic ports, so endpoints are read from SecretsManager at startup
  # (convertx/postgres/endpoint, convertx/redis/endpoint).
  DB_USER: convertx
  PORT: "8080"
  AWS_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "http://localstack.localstack.svc.cluster.local:4566"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"