apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: convertx
spec:
  # No `replicas:` — the HorizontalPodAutoscaler in hpa.yaml owns this. If it
  # were set here, every `kubectl apply` would reset the count and fight the
  # HPA for control of it.
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: convertx/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-service-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/auth/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/auth/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5