# Local dependencies for the conversion service ONLY.
#
# Scoped deliberately:
#   - It lives in this service's directory and carries its own project name,
#     so it cannot merge with another compose project.
#   - The root setup.sh never invokes docker compose. It builds images and
#     applies Kubernetes manifests, where Redis is an ElastiCache cluster
#     inside LocalStack. Running the whole project does not touch this file.
#   - .dockerignore keeps it out of the service image.
#
# This file starts DEPENDENCIES ONLY. There is no service that builds from the
# Dockerfile, so `docker compose up` has nothing to build — the app always runs
# separately with `go run`.
#
# Usage, from this directory:
#
#   1. no dependencies at all (in-memory cache)
#        go run ./cmd/main.go
#
#   2. against a real Redis
#        docker compose up -d --wait
#        REDIS_HOST=localhost:6379 REDIS_PASSWORD=localdev go run ./cmd/main.go
#
#   3. against Redis + SecretsManager (exercises the deployed code path)
#        LOCALSTACK_PORT=4567 docker compose --profile aws up -d --wait
#        AWS_ENDPOINT_URL=http://localhost:4567 AWS_REGION=us-east-1 \
#          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test go run ./cmd/main.go
#
#   4. with Prometheus + Grafana, to see the dashboard without a cluster
#        docker compose --profile monitoring up -d --wait
#        go run ./cmd/main.go
#      then open http://localhost:3001 (anonymous; the dashboard is preloaded)
#
#   stop:  docker compose --profile aws --profile monitoring down -v

name: convertx-conversion-dev

services:
  redis:
    image: redis:7.2-alpine
    container_name: convertx-dev-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-localdev}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdev}", "--no-auth-warning", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Only for exercising the SecretsManager code path, and pinned to 3.4 on
  # purpose: localstack/localstack:latest is now a Pro build that exits 55
  # ("License activation failed") without an auth token, and ACTIVATE_PRO=0
  # does not override it. 3.4 is the last straightforwardly community image,
  # and secretsmanager is a community service, so this needs no token at all.
  # Working on conversions should not require a paid licence.
  #
  # The deployed stack uses LocalStack Pro for RDS/ElastiCache/Cognito/
  # CloudFront; none of that is needed to work on conversions.
  #
  # NOTE: 4566 collides with any other LocalStack already running on the host.
  # Override with LOCALSTACK_PORT=4567 (and point AWS_ENDPOINT_URL at it).
  localstack:
    profiles: ["aws"]
    image: localstack/localstack:3.4
    container_name: convertx-dev-localstack
    environment:
      SERVICES: secretsmanager
      DEBUG: "0"
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
      # Address the service (running on the host) should use for Redis.
      SEED_REDIS_ENDPOINT: "${SEED_REDIS_ENDPOINT:-localhost:6379}"
      SEED_REDIS_PASSWORD: "${REDIS_PASSWORD:-localdev}"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      # Scripts in ready.d run once LocalStack is accepting requests.
      - ./dev/seed-secrets.sh:/etc/localstack/init/ready.d/seed-secrets.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Monitoring profile ───────────────────────────────────────────────────
  # Runs the same Prometheus + Grafana pair the cluster runs, against the
  # service on the host, so a dashboard change can be checked in seconds
  # instead of through a full setup.sh.
  #
  # Ports default to 3001/9091, NOT 3000/9090: setup.sh leaves port-forwards
  # running on the cluster's Grafana and Prometheus, and colliding with them
  # would either fail to bind or — worse — leave you looking at the cluster's
  # data while thinking it is local. Same lesson as LOCALSTACK_PORT above.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.7.1
    container_name: convertx-dev-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # No-op on Docker Desktop, which defines this already; required on Linux.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.2.1
    container_name: convertx-dev-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./dev/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./dev/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dash.yml:ro
      # Reaches up to the repo-root dashboards on purpose: one definition, used
      # by both the cluster and this compose file. A copy here would drift, and
      # you would not notice until a panel was wrong in only one of them.
      - ../../infra/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
