apiVersion: v1
kind: ConfigMap
metadata:
  name: conversion-service-config
  namespace: convertx
data:
  # REDIS_HOST intentionally absent: the ElastiCache endpoint is read from
  # SecretsManager (convertx/redis/endpoint) because its port is dynamic.
  PORT: "8080"
  CACHE_TTL_MINUTES: "60"
  AWS_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "http://localstack.localstack.svc.cluster.local:4566"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"