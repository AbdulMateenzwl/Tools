apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversion-service
  namespace: convertx
spec:
  # No `replicas:` — the HorizontalPodAutoscaler in hpa.yaml owns this. If it
  # were set here, every `kubectl apply` would reset the count and fight the
  # HPA for control of it.
  selector:
    matchLabels:
      app: conversion-service
  template:
    metadata:
      labels:
        app: conversion-service
      annotations:
        # Scraped on the app port: /metrics is served by the same Gin engine but
        # sits outside /api/v1, so Kong never routes to it and it is reachable
        # only from inside the cluster.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # 20s drain + 5s preStop, with headroom before SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: conversion-service
          image: convertx/conversion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: conversion-service-config
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          # Endpoint removal is ASYNCHRONOUS with SIGTERM: the kubelet signals
          # this container at the same moment the EndpointSlice update starts
          # propagating to Kong. Without this pause the pod stops accepting
          # work while Kong is still routing to it, and those requests are
          # dropped no matter how gracefully the process shuts down.
          # The container keeps serving normally for these 5s; it is the
          # endpoint propagation we are waiting out, not the process.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /api/v1/convert/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/convert/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5