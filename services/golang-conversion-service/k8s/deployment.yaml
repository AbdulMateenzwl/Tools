apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversion-service
  namespace: convertx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conversion-service
  template:
    metadata:
      labels:
        app: conversion-service
      annotations:
        # Scraped on the app port: /metrics is served by the same Gin engine but
        # sits outside /api/v1, so Kong never routes to it and it is reachable
        # only from inside the cluster.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: conversion-service
          image: convertx/conversion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: conversion-service-config
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/convert/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/convert/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5